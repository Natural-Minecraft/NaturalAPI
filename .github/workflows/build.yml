name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build and Release JAR
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-naturalsmp</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Dependencies (NaturalCore & NaturalSchool)
        env:
          # CATATAN: Jika NaturalCore dan NaturalSchool adalah repository PRIVATE, 
          # GitHub Token bawaan tidak akan punya akses. Kamu harus membuat Personal Access Token (PAT),
          # menyimpannya di Repository Secrets (misal: PAT_TOKEN), lalu ubah baris di bawah ini menjadi:
          # GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p lib
          
          echo "Downloading NaturalCore..."
          gh release download --repo Natural-Minecraft/NaturalCore --pattern "NaturalCore.jar" --dir lib
          
          echo "Downloading NaturalSchool..."
          gh release download --repo Natural-Minecraft/NaturalSchool --pattern "NaturalSchool.jar" --dir lib

      - name: Install local JARs to Maven
        run: |
          mvn install:install-file \
            -Dfile=lib/NaturalCore.jar \
            -DgroupId=id.naturalsmp \
            -DartifactId=NaturalCore \
            -Dversion=2.2.3 \
            -Dpackaging=jar \
            -DgeneratePom=true
          mvn install:install-file \
            -Dfile=lib/NaturalSchool.jar \
            -DgroupId=id.naturalsmp \
            -DartifactId=naturalschool \
            -Dversion=1.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build with Maven
        run: mvn clean package

      - name: Extract Project Info
        id: info
        run: |
          echo "artifact_name=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_OUTPUT
          echo "artifact_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Create Production Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.info.outputs.artifact_version }}
          name: NaturalAPI v${{ steps.info.outputs.artifact_version }}
          body: |
            Automated Production Build from NaturalSMP CI/CD.
            Last Build Time: ${{ github.event.head_commit.timestamp }}
            Commit: ${{ github.sha }}
          files: target/NaturalAPI-${{ steps.info.outputs.artifact_version }}.jar
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: mvn deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}