            schema:
              $ref: "#/components/schemas/PapiEvaluateRequest"
            example:
              player: "Notch"
              placeholders:
                - "%player_health%"
                - "%vault_rank%"
                - "%luckperms_primary_group%"
      responses:
        "200":
          description: Placeholder berhasil dievaluasi
          content:
            application/json:
              example:
                success: true
                timestamp: 1717600000000
                data:
                  player: "Notch"
                  uuid: "069a79f4-44e9-4726-a5be-fca90e38aaf5"
                  results:
                    "%player_health%": "20.0"
                    "%vault_rank%": "Admin"
