openapi: "3.1.0"

info:
  title: NaturalAPI
  description: |
    REST API lengkap untuk server Minecraft 1.21.x.
    Menyediakan akses real-time ke data server, player, world, Vault, LuckPerms, dan PlaceholderAPI.

    ## Autentikasi
    Semua endpoint memerlukan Bearer token kecuali `/admin/health` dan `/swagger`.
    
    ```
    Authorization: Bearer napi_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    ```

    ## Rate Limiting
    Default: 120 request/menit per IP. Header response:
    - `X-RateLimit-Limit` — batas request per menit
    - `X-RateLimit-Remaining` — sisa request
    - `X-RateLimit-Reset` — Unix timestamp reset berikutnya

    ## Response Format
    Semua response mengikuti format standar:
    ```json
    {
      "success": true,
      "timestamp": 1717600000000,
      "data": { ... }
    }
    ```
    Atau untuk error:
    ```json
    {
      "success": false,
      "error": {
        "code": "PLAYER_NOT_FOUND",
        "message": "...",
        "timestamp": 1717600000000
      }
    }
    ```
  version: "1.0.0"
  contact:
    name: NaturalSMP Team
    url: https://naturalsmp.id
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:7890/api/v1
    description: Local Development
  - url: http://your-server-ip:7890/api/v1
    description: Production Server

tags:
  - name: Server
    description: Statistik dan info server
  - name: Players
    description: Data player online dan offline
  - name: Worlds
    description: Data world yang ter-load
  - name: Vault
    description: Data Vault (economy, permissions, ranks)
  - name: LuckPerms
    description: Data LuckPerms (groups, nodes, meta)
  - name: PAPI
    description: PlaceholderAPI — evaluasi placeholder
  - name: Admin
    description: Manajemen API key, konfigurasi, health check

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "API key yang di-generate via `/napi key generate`. Format: `napi_xxxxxx`"

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        timestamp:
          type: integer
          format: int64
          example: 1717600000000
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "PLAYER_NOT_FOUND"
            message:
              type: string
              example: "No player found with UUID: abc123"
            timestamp:
              type: integer
              format: int64

    TpsData:
      type: object
      properties:
        "1m":
          type: number
          format: double
          example: 19.98
        "5m":
          type: number
          format: double
          example: 19.95
        "15m":
          type: number
          format: double
          example: 19.91

    PlayerCount:
      type: object
      properties:
        online:
          type: integer
          example: 12
        visible:
          type: integer
          example: 10
        vanished:
          type: integer
          example: 2
        max:
          type: integer
          example: 100

    ServerStatus:
      type: object
      properties:
        online:
          type: boolean
        version:
          type: string
          example: "1.21.1"
        platform:
          type: string
          example: "Paper"
        tps:
          $ref: "#/components/schemas/TpsData"
        players:
          $ref: "#/components/schemas/PlayerCount"
        mspt:
          type: number
          example: 3.21
        uptime:
          type: integer
          example: 86400

    Location:
      type: object
      properties:
        world:
          type: string
          example: "world"
        x:
          type: number
          format: double
          example: 128.5
        y:
          type: number
          format: double
          example: 64.0
        z:
          type: number
          format: double
          example: -256.3
        yaw:
          type: number
          format: float
          example: 90.0
        pitch:
          type: number
          format: float
          example: 0.0

    ItemStack:
      type: object
      properties:
        slot:
          type: integer
          example: 0
        material:
          type: string
          example: "DIAMOND_SWORD"
        amount:
          type: integer
          example: 1
        displayName:
          type: string
          nullable: true
          example: "§6Excalibur"
        lore:
          type: array
          items:
            type: string
          nullable: true
        damage:
          type: integer
          example: 0
        enchantments:
          type: object
          additionalProperties:
            type: integer
          example:
            SHARPNESS: 5
            UNBREAKING: 3
        customModelData:
          type: integer
          nullable: true
        nbtJson:
          type: string
          nullable: true

    ArmorInventory:
      type: object
      properties:
        helmet:
          $ref: "#/components/schemas/ItemStack"
          nullable: true
        chestplate:
          $ref: "#/components/schemas/ItemStack"
          nullable: true
        leggings:
          $ref: "#/components/schemas/ItemStack"
          nullable: true
        boots:
          $ref: "#/components/schemas/ItemStack"
          nullable: true

    PotionEffect:
      type: object
      properties:
        type:
          type: string
          example: "SPEED"
        amplifier:
          type: integer
          example: 1
        durationTicks:
          type: integer
          example: 600
        durationSeconds:
          type: number
          example: 30.0
        ambient:
          type: boolean
        particles:
          type: boolean
        icon:
          type: boolean

    SkinData:
      type: object
      properties:
        textureUrl:
          type: string
          example: "https://textures.minecraft.net/texture/abc123..."
        textureValue:
          type: string
          description: Base64 encoded texture value
        signature:
          type: string
          description: Mojang signature
        cachedAt:
          type: integer
          format: int64

    VaultData:
      type: object
      properties:
        group:
          type: string
          nullable: true
          example: "admin"
        groups:
          type: array
          items:
            type: string
          nullable: true
        prefix:
          type: string
          nullable: true
          example: "§c[Admin] "
        suffix:
          type: string
          nullable: true
          example: " §7✦"
        balance:
          type: number
          format: double
          nullable: true
          example: 15000.50
        currency:
          type: string
          nullable: true
          example: "Dollars"
        permissionPlugin:
          type: string
          nullable: true
          example: "LuckPerms"
        economyPlugin:
          type: string
          nullable: true
          example: "EssentialsX"

    LuckPermsData:
      type: object
      properties:
        primaryGroup:
          type: string
          example: "admin"
        parentGroups:
          type: array
          items:
            type: string
        inheritedGroups:
          type: array
          items:
            type: string
        permissionNodes:
          type: array
          items:
            type: object
            properties:
              node:
                type: string
              value:
                type: boolean
              context:
                type: object
        meta:
          type: object
          additionalProperties:
            type: string
        weight:
          type: integer
          nullable: true

    SchoolData:
      type: object
      properties:
        nis:
          type: string
          nullable: true
          example: "2026-0004"
        academicStage:
          type: string
          nullable: true
          example: "SMA"
        academicClass:
          type: integer
          example: 10
        currentSemester:
          type: string
          example: "GANJIL"
        rank:
          type: object
          nullable: true
          properties:
            id:
              type: string
              example: "SMA_10"
            displayName:
              type: string
              example: "§dSiswa X SMA"
            priority:
              type: integer
              example: 30
            type:
              type: string
              enum: [MANAGEMENT, STAFF, HELPER, STUDENT, NONE]
              example: "STUDENT"
        isStaff:
          type: boolean
          example: false
        isManagement:
          type: boolean
          example: false

    PlayerSummary:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          example: "069a79f4-44e9-4726-a5be-fca90e38aaf5"
        username:
          type: string
          example: "Notch"
        displayName:
          type: string
        online:
          type: boolean
        vanished:
          type: boolean

    PlayerFull:
      allOf:
        - $ref: "#/components/schemas/PlayerSummary"
        - type: object
          properties:
            location:
              $ref: "#/components/schemas/Location"
            health:
              type: number
              format: double
            maxHealth:
              type: number
              format: double
            foodLevel:
              type: integer
            saturation:
              type: number
            expLevel:
              type: integer
            expProgress:
              type: number
            totalExp:
              type: integer
            gamemode:
              type: string
              enum: [SURVIVAL, CREATIVE, ADVENTURE, SPECTATOR]
            ping:
              type: integer
            locale:
              type: string
            clientBrand:
              type: string
            protocolVersion:
              type: integer
            vault:
              $ref: "#/components/schemas/VaultData"
            luckperms:
              $ref: "#/components/schemas/LuckPermsData"
            school:
              $ref: "#/components/schemas/SchoolData"
            firstJoin:
              type: integer
              format: int64
            lastSeen:
              type: integer
              format: int64
            totalPlaytimeMs:
              type: integer
              format: int64

    WorldInfo:
      type: object
      properties:
        name:
          type: string
          example: "world"
        environment:
          type: string
          enum: [NORMAL, NETHER, THE_END, CUSTOM]
        seed:
          type: integer
          format: int64
          nullable: true
        time:
          type: integer
        fullTime:
          type: integer
        dayCount:
          type: integer
        weather:
          type: string
          enum: [CLEAR, RAIN, THUNDER]
        playerCount:
          type: integer
        entityCount:
          type: integer
        loadedChunks:
          type: integer
        pvp:
          type: boolean
        difficulty:
          type: string

    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
          nullable: true
        lastUsed:
          type: integer
          format: int64
          nullable: true
        enabled:
          type: boolean

    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          properties:
            key:
              type: string
              description: "Full API key. Only shown once!"
              example: "napi_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

    PapiEvaluateRequest:
      type: object
      required:
        - player
        - placeholders
      properties:
        player:
          type: string
          description: UUID atau username
          example: "Notch"
        placeholders:
          type: array
          items:
            type: string
          example: ["%player_health%", "%vault_rank%", "%luckperms_primary_group%"]

    CreateKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "MyDashboard"
        scopes:
          type: array
          items:
            type: string
          example: ["read:server", "read:players"]
          default: ["read:server", "read:players", "read:worlds"]
        expiresAt:
          type: integer
          format: int64
          nullable: true
          description: Unix timestamp expiry, null = never

  responses:
    Unauthorized:
      description: Token tidak valid atau hilang
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: "INVALID_TOKEN"
              message: "Bearer token not found or invalid"
              timestamp: 1717600000000

    Forbidden:
      description: Scope tidak cukup atau IP diblokir
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    TooManyRequests:
      description: Rate limit terlampaui
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
            format: int64
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

security:
  - BearerAuth: []

paths:

  # ─────────────────────────────────────────
  # SERVER
  # ─────────────────────────────────────────

  /server:
    get:
      tags: [Server]
      summary: Full server overview
      operationId: getServer
      security:
        - BearerAuth: ["read:server"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ServerStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /server/status:
    get:
      tags: [Server]
      summary: Status ringkas server
      operationId: getServerStatus
      security:
        - BearerAuth: ["read:server"]
      responses:
        "200":
          description: OK

  /server/tps:
    get:
      tags: [Server]
      summary: TPS 1m/5m/15m
      operationId: getServerTps
      security:
        - BearerAuth: ["read:server"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TpsData"

  /server/mspt:
    get:
      tags: [Server]
      summary: Rata-rata MSPT
      operationId: getServerMspt
      security:
        - BearerAuth: ["read:server"]
      responses:
        "200":
          description: OK

  /server/ram:
    get:
      tags: [Server]
      summary: RAM usage
      operationId: getServerRam
      security:
        - BearerAuth: ["read:server"]
      responses:
        "200":
          description: OK

  /server/uptime:
    get:
      tags: [Server]
      summary: Uptime server dalam detik
      operationId: getServerUptime
      security:
        - BearerAuth: ["read:server"]
      responses:
        "200":
          description: OK

  /server/version:
    get:
      tags: [Server]
      summary: Versi Minecraft + platform
      operationId: getServerVersion
      security:
        - BearerAuth: ["read:server"]
      responses:
        "200":
          description: OK

  /server/players/count:
    get:
      tags: [Server]
      summary: Jumlah player (vanish-aware)
      operationId: getServerPlayerCount
      security:
        - BearerAuth: ["read:server"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PlayerCount"

  /server/plugins:
    get:
      tags: [Server]
      summary: Semua plugin ter-load
      operationId: getServerPlugins
      security:
        - BearerAuth: ["read:server"]
      responses:
        "200":
          description: OK

  /server/whitelist:
    get:
      tags: [Server]
      summary: Daftar player di whitelist
      operationId: getServerWhitelist
      security:
        - BearerAuth: ["read:server"]
      responses:
        "200":
          description: OK

  /server/banlist:
    get:
      tags: [Server]
      summary: Daftar player yang dibanned
      operationId: getServerBanlist
      security:
        - BearerAuth: ["read:server"]
      responses:
        "200":
          description: OK

  /server/leaderboard:
    get:
      tags: [Server]
      summary: Leaderboard player berdasarkan statistik
      description: Mengambil data leaderboard player berdasarkan jenis statistik tertentu (playtime, balance, kills, deaths, votes, exp, atau custom PlaceholderAPI placeholder).
      operationId: getLeaderboard
      security:
        - BearerAuth: ["read:server"]
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
          description: Jenis statistik (playtime, balance, kills, deaths, votes, exp, ajlb:<board>[:time_type], atau placeholder)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Jumlah entry maksimal yang dikembalikan
      responses:
        "200":
          description: OK

  # ─────────────────────────────────────────
  # PLAYERS
  # ─────────────────────────────────────────

  /players:
    get:
      tags: [Players]
      summary: Daftar semua player online
      operationId: getPlayers
      security:
        - BearerAuth: ["read:players"]
      parameters:
        - name: includeVanished
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Sertakan player yang sedang vanish
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                       data:
                         type: array
                         items:
                           $ref: "#/components/schemas/PlayerSummary"
 
   /players/all:
     get:
       tags: [Players]
       summary: Daftar semua player online dan offline (paged & searchable)
       operationId: getAllPlayers
       security:
         - BearerAuth: ["read:players"]
       parameters:
         - name: page
           in: query
           schema:
             type: integer
             default: 1
           description: Halaman data yang ingin diambil
         - name: pageSize
           in: query
           schema:
             type: integer
             default: 50
           description: Jumlah data per halaman
         - name: search
           in: query
           schema:
             type: string
           description: Pencarian berdasarkan username atau displayName
         - name: status
           in: query
           schema:
             type: string
             enum: [all, online, offline]
             default: all
           description: Filter status player (all, online, offline)
         - name: includeVanished
           in: query
           schema:
             type: boolean
             default: false
           description: Sertakan player online yang sedang vanish
       responses:
         "200":
           description: OK
           content:
             application/json:
               schema:
                 allOf:
                   - $ref: "#/components/schemas/SuccessResponse"
                   - type: object
                     properties:
                       data:
                         type: object
                         properties:
                           players:
                             type: array
                             items:
                               type: object
                               properties:
                                 uuid:
                                   type: string
                                   format: uuid
                                 username:
                                   type: string
                                 displayName:
                                   type: string
                                 online:
                                   type: boolean
                                 vanished:
                                   type: boolean
                                 afk:
                                   type: boolean
                                 staffMode:
                                   type: boolean
                                 lastSeen:
                                   type: integer
                                   format: int64
                           pagination:
                             type: object
                             properties:
                               page:
                                 type: integer
                               pageSize:
                                 type: integer
                               total:
                                 type: integer
                               totalPages:
                                 type: integer

  /players/{uuid}:
    get:
      tags: [Players]
      summary: Data lengkap player by UUID
      operationId: getPlayerByUuid
      security:
        - BearerAuth: ["read:players"]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PlayerFull"
        "404":
          $ref: "#/components/responses/NotFound"

  /players/name/{username}:
    get:
      tags: [Players]
      summary: Data lengkap player by username
      operationId: getPlayerByUsername
      security:
        - BearerAuth: ["read:players"]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"

  /players/{uuid}/location:
    get:
      tags: [Players]
      summary: Lokasi player (world, x, y, z, yaw, pitch)
      operationId: getPlayerLocation
      security:
        - BearerAuth: ["read:players"]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Location"

  /players/{uuid}/health:
    get:
      tags: [Players]
      summary: Health, food, saturation
      operationId: getPlayerHealth
      security:
        - BearerAuth: ["read:players"]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK

  /players/{uuid}/experience:
    get:
      tags: [Players]
      summary: Level, XP progress, total XP
      operationId: getPlayerExperience
      security:
        - BearerAuth: ["read:players"]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK

  /players/{uuid}/gamemode:
    get:
      tags: [Players]
      summary: Gamemode saat ini
      operationId: getPlayerGamemode
      security:
        - BearerAuth: ["read:players"]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK

  /players/{uuid}/inventory:
    get:
      tags: [Players]
      summary: Full inventory (36 slot + armor + offhand)
      operationId: getPlayerInventory
      security:
        - BearerAuth: ["read:players"]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          uuid:
                            type: string
                          username:
                            type: string
                          inventory:
                            type: array
                            items:
                              $ref: "#/components/schemas/ItemStack"
                          armor:
                            $ref: "#/components/schemas/ArmorInventory"
                          offhand:
                            $ref: "#/components/schemas/ItemStack"

  /players/{uuid}/inventory/hotbar:
    get:
      tags: [Players]
      summary: Hotbar saja (slot 0-8)
      operationId: getPlayerHotbar
      security:
        - BearerAuth: ["read:players"]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK

  /players/{uuid}/inventory/armor:
    get:
      tags: [Players]
      summary: Armor (helm, dada, kaki, sepatu)
      operationId: getPlayerArmor
      security:
        - BearerAuth: ["read:players"]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
